<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="'Trebuchet MS','Segoe UI',sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#2a0606"/><stop offset="55%" stop-color="#120303"/><stop offset="100%" stop-color="#070707"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff5555"/><stop offset="100%" stop-color="#c41414"/></linearGradient>
    <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#c41414"/><stop offset="45%" stop-color="#ff6a6a"/><stop offset="100%" stop-color="#a01010"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g stroke="#7a0f0f" stroke-width="1.2" opacity="0.4"><path d="M120,600 H1160 M40,660 H1240 M300,700 L600,520 M980,700 L680,520"/></g>

  <text x="64" y="88" fill="#ff5a5a" font-size="46" font-weight="bold" filter="url(#glow)">TWO KINDS OF MEMORY.</text>
  <line x1="640" y1="150" x2="640" y2="650" stroke="#8a1212" stroke-width="2" stroke-dasharray="3 11" opacity="0.7"/>

  <!-- SHORT TERM -->
  <text x="330" y="206" fill="#ff6a6a" font-size="34" font-weight="bold" text-anchor="middle" filter="url(#glow)">SHORT-TERM</text>
  <text x="330" y="240" fill="#c93333" font-size="22" text-anchor="middle">this conversation</text>
  <!-- chat slabs -->
  <g filter="url(#glow)">
    <rect x="170" y="300" width="210" height="58" rx="14" fill="#7a0f0f"/><rect x="170" y="290" width="210" height="58" rx="14" fill="url(#face)" stroke="#ff9a9a" stroke-width="2"/>
  </g>
  <text x="275" y="326" fill="#fff" font-size="18" text-anchor="middle">what we just said</text>
  <g filter="url(#glow)">
    <rect x="290" y="380" width="210" height="58" rx="14" fill="#7a0f0f"/><rect x="290" y="370" width="210" height="58" rx="14" fill="url(#face)" stroke="#ff9a9a" stroke-width="2"/>
  </g>
  <text x="395" y="406" fill="#fff" font-size="18" text-anchor="middle">a minute ago</text>
  <text x="330" y="510" fill="#c93333" font-size="19" text-anchor="middle">→ a session file</text>

  <!-- LONG TERM -->
  <text x="950" y="206" fill="#ff6a6a" font-size="34" font-weight="bold" text-anchor="middle" filter="url(#glow)">LONG-TERM</text>
  <text x="950" y="240" fill="#c93333" font-size="22" text-anchor="middle">stuff it should always know</text>

  <!-- 3D database cylinder -->
  <g filter="url(#glow)">
    <path d="M838,330 L838,452 A66,20 0 0 0 970,452 L970,330" fill="url(#cyl)" stroke="#ff9a9a" stroke-width="2"/>
    <ellipse cx="904" cy="330" rx="66" ry="20" fill="#ff7a7a" stroke="#ffcaca" stroke-width="2"/>
    <ellipse cx="904" cy="368" rx="66" ry="20" fill="none" stroke="#ffb3b3" stroke-width="1.5" opacity="0.6"/>
    <ellipse cx="904" cy="406" rx="66" ry="20" fill="none" stroke="#ffb3b3" stroke-width="1.5" opacity="0.6"/>
  </g>
  <text x="904" y="494" fill="#ffb3b3" font-size="17" text-anchor="middle">searchable database</text>

  <!-- 3D MEMORY.md file -->
  <g filter="url(#glow)" transform="translate(1010 332)">
    <rect x="6" y="10" width="118" height="92" rx="10" fill="#7a0f0f"/>
    <rect x="0" y="0" width="118" height="92" rx="10" fill="url(#face)" stroke="#ff9a9a" stroke-width="2"/>
    <line x1="18" y1="28" x2="100" y2="28" stroke="#fff" stroke-width="2.5"/>
    <line x1="18" y1="46" x2="100" y2="46" stroke="#ffdada" stroke-width="2.5"/>
    <line x1="18" y1="64" x2="74" y2="64" stroke="#ffdada" stroke-width="2.5"/>
  </g>
  <text x="1069" y="452" fill="#ffb3b3" font-size="17" text-anchor="middle">MEMORY.md</text>

  <text x="950" y="540" fill="#c93333" font-size="19" text-anchor="middle">"remember this" → written down</text>

  <text x="640" y="688" fill="#ff6a6a" font-size="24" font-weight="bold" text-anchor="middle" filter="url(#glow)">restart it tomorrow — it still knows you.</text>
</svg>
